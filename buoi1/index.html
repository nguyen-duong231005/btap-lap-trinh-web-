<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý công việc cá nhân (Mini Task Manager)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Mini Task Manager</h1>
        </header>

        <!-- Form thêm công việc -->
        <section class="form-section">
            <form id="task-form">
                <div class="form-group">
                    <label for="task-name">Tên công việc (*):</label>
                    <input type="text" id="task-name" placeholder="Nhập tên công việc...">
                    <small id="error-msg" class="error"></small>
                </div>
                <div class="form-group">
                    <label for="task-date">Hạn hoàn thành:</label>
                    <input type="date" id="task-date">
                </div>
                <div class="form-group">
                    <label for="task-priority">Mức ưu tiên:</label>
                    <select id="task-priority">
                        <option value="Cao">Cao</option>
                        <option value="Trung bình" selected>Trung bình</option>
                        <option value="Thấp">Thấp</option>
                    </select>
                </div>
                <button type="submit" id="add-btn">Thêm</button>
            </form>
        </section>

        <!-- Ô tìm kiếm và bộ lọc trạng thái -->
        <section class="filter-section">
            <input type="text" id="search-input" placeholder="Tìm kiếm theo tên công việc...">
            <select id="status-filter">
                <option value="all">Tất cả</option>
                <option value="incomplete">Chưa hoàn thành</option>
                <option value="completed">Đã hoàn thành</option>
            </select>
        </section>

        <!-- Vùng hiển thị danh sách công việc -->
        <section class="list-section">
            <ul id="task-list">
                <!-- Dữ liệu được render động bằng JavaScript -->
            </ul>
        </section>

        <!-- Footer ghi họ tên, MSSV -->
        <footer>
            <p>Họ tên: Thiều Thị Ngấn | MSSV: 224001737 | Lớp: TUD D2024</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
